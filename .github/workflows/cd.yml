name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ steps.repo.outputs.lc }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        id: repo
        run: echo "lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.lc }}:${{ github.sha }}

  deploy-dev:
    needs: build-and-push
    runs-on: self-hosted
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to dev
        run: |
          kubectl set image deployment/my-app my-app=${{ needs.build-and-push.outputs.image }} -n dev
          kubectl rollout status deployment/my-app -n dev --timeout=90s

  deploy-prod:
    needs: [build-and-push, deploy-dev]
    runs-on: self-hosted
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to prod
        run: |
          kubectl set image deployment/my-app my-app=${{ needs.build-and-push.outputs.image }} -n prod
          kubectl rollout status deployment/my-app -n prod --timeout=90s